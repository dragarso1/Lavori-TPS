<!DOCTYPE html>
<html>
    <head>
        <title>Conversione</title>
        <h1>Convertitore indirizzo IP da decimale a binario</h1>
    </head>
    <body>
        <h3>(il numero deve eseere compreso tra 0 e 255)</h3>
        <input type = "text" id = "numero1">
        <input type = "text" id = "numero2">
        <input type = "text" id = "numero3">
        <input type = "text" id = "numero4">
        <button id = "pulsante" onclick = "convertitore()">Converti</button>
        <br>
        <h4>Inserire prefixLength</h4>
        <input type = "text" id = "prefixLength">
        <p id = "paragrap1"></p>
        <p id = "paragrap2"></p>
        <a href="https://dragarso1.github.io/Lavori-TPS/">Torna all'index</a>
        <script>
            function convertitore() {
                let numero1 = parseInt(document.getElementById("numero1").value)
                let numero2 = parseInt(document.getElementById("numero2").value)
                let numero3 = parseInt(document.getElementById("numero3").value)
                let numero4 = parseInt(document.getElementById("numero4").value)
                let numeroBinario1 = ""
                let numeroBinario2 = ""
                let numeroBinario3 = ""
                let numeroBinario4 = ""
                let prefixLength = parseInt(document.getElementById("prefixLength").value)
                if (numero1 > 255 || numero1 < 0 || numero2 > 255 || numero2 < 0 || numero3 > 255 || numero3 < 0 || numero4 > 255 || numero4 < 0) {
                    document.getElementById("paragrap1").innerHTML = "Numero invalido."
                } else {
                while (numero1 > 0) {
                    let resto1 = numero1 % 2
                    numeroBinario1 = resto1 + numeroBinario1
                    numero1 = Math.floor(numero1 / 2) 
                }
                while (numeroBinario1.length < 8) {
                    numeroBinario1 = "0" + numeroBinario1
                }
                while (numero2 > 0) {
                    let resto2 = numero2 % 2
                    numeroBinario2 = resto2 + numeroBinario2
                    numero2 = Math.floor(numero2 / 2) 
                }
                while (numeroBinario2.length < 8) {
                    numeroBinario2 = "0" + numeroBinario2
                }
                while (numero3 > 0) {
                    let resto3 = numero3 % 2
                    numeroBinario3 = resto3 + numeroBinario3
                    numero3 = Math.floor(numero3 / 2) 
                }
                while (numeroBinario3.length < 8) {
                    numeroBinario3 = "0" + numeroBinario3
                }
                while (numero4 > 0) {
                    let resto4 = numero4 % 2
                    numeroBinario4 = resto4 + numeroBinario4
                    numero4 = Math.floor(numero4 / 2) 
                }
                while (numeroBinario4.length < 8) {
                    numeroBinario4 = "0" + numeroBinario4
                }
                document.getElementById("paragrap1").innerHTML = "Binario: " + numeroBinario1 + " " + numeroBinario2 + " " + numeroBinario3 + " " + numeroBinario4
                //Subnetmask
                let host = 32 - prefixLength
                let subnetMask = ""
                if (prefixLength > 32 || prefixLength < 0) {
                    document.getElementById("paragrap2").innerHTML = "Numero invalido."
                } else {
                    for (let i = 0; i < prefixLength; i++) {
                        subnetMask += "1"
                    }
                    for (let i = 0; i < host; i++) {
                        subnetMask += "0"
                    }
                    document.getElementById("paragrap2").innerHTML = "Subnetmask: " + subnetMask
                }
                }
            }
        </script>
    </body>
</html>
