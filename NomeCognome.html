<!DOCTYPE html>
<html>
    <head>
        <title>Nome Cognome</title>
        <h1>Nome Cognome</h1>
    </head>
    <body>
        <input type="text" id = "nome">
        <input type="text" id = "cognome">
        <button id = "pulsante" onclick="scrittura()">Scrivi</button>
        <p id = "paragrap"></p>
        <a href="https://dragarso1.github.io/Lavori-TPS/"></a>
        <script>
            function scrittura() {
                let nome = document.getElementById("nome").value
                let cognome = document.getElementById("cognome").value
                document.getElementById("paragrap").innerHTML = nome + " " + cognome
            }
        </script>
    </body>
</html>
